      href: "#contact"
      variant: white
      icon: true
    - label: See Plans
      href: "#plans"
      variant: ghost-light
      icon: false

# ── Plans ─────────────────────────────────────────────────────────────────────

plans:
  items:
    - name: Nano
      tagline: Your first custom-built online presence
      price: "$1,300"
      priceNote: one-time payment
      delivery: Ready in 10–15 business days
      bestFor: "Freelancers, home services, solo professionals, new businesses ready for a real website"
      includes:
        - Custom-built one-page website with up to 5 sections
        - "Home, About, Services, Gallery, and Contact"
        - "Contact form (name, email, message)"
        - Your own content management panel — update text and photos yourself
        - Mobile-friendly design
        - Basic Google visibility setup (SEO)
        - Cloudflare security and speed protection
        - 2 rounds of feedback before launch
        - 15-minute video tutorial to manage your site
      excludes:
        - Online store or payments
        - Blog
        - Booking system
      ctaLabel: Get Started
      ctaHref: "#contact"

    - name: Micro
      tagline: "More pages, more tools, more customers — all custom built"
      price: "$2,800"
      priceNote: one-time payment
      delivery: Ready in 18–25 business days
      bestFor: "Restaurants, salons, retail shops, service businesses that need more than a single page"
      includes:
        - Up to 10 custom-built pages with their own web addresses
        - Blog — publish news, tips, and updates yourself
        - Google Maps location on your site
        - Live chat widget so visitors can message you instantly
        - Google Analytics — see how many people visit your site
        - Up to 2 custom contact forms
        - Advanced Google visibility setup
        - 3 rounds of feedback before launch
        - Everything in Nano
      excludes:
        - Online store or payments
        - Booking system
      ctaLabel: Get Started
      ctaHref: "#contact"
      popular: true

    - name: Pro
      tagline: Full custom development — sell online, take bookings, grow faster
      price: "$5,500"
      priceNote: one-time payment
      delivery: Ready in 35–50 business days
      bestFor: "Retailers, service businesses that take appointments, anyone ready to sell online with a real custom store"
      includes:
        - Unlimited pages
        - Online store — sell up to 100 products
        - Secure online payments via Stripe (credit and debit cards)
        - Booking and appointment system
        - Email list signup connected to Mailchimp
        - Full custom design built from scratch
        - Conversion tracking — know which pages bring you customers
        - Performance optimization — loads fast on any device
        - 4 rounds of feedback before launch
        - Everything in Micro
      excludes:
        - "More than 100 products (available as add-on at $2/product)"
      ctaLabel: Get Started
      ctaHref: "#contact"

    - name: Enterprise
      tagline: "Complex custom projects, built exactly to your specs"
      price: Custom
      priceNote: after a free discovery call
      delivery: Timeline defined in proposal
      bestFor: "Businesses with specific integrations, large catalogs, or complex requirements that go beyond standard plans"
      includes:
        - Everything in Pro
        - Unlimited products
        - Multiple languages (English + Spanish)
        - Custom system integrations
        - Advanced business automation
        - Dedicated account manager
        - Priority support and SLA
      ctaLabel: "Let's Talk"
      ctaHref: "#contact"

