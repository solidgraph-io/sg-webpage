# ── How It Works ──────────────────────────────────────────────────────────────

howItWorks:
  steps:
    - num: "01"
      title: We Talk
      dur: 30 minutes
      text: "You tell us about your business, your customers, and what you need. No forms, no pressure — just a real conversation. Free, no commitment."
    - num: "02"
      title: We Plan
      dur: 1–2 days
      text: "We put together a clear proposal: what your website will include, what it will cost, and when it will be ready. You approve it before we touch anything."
    - num: "03"
      title: We Build
      dur: 10–25 business days
      text: "Our team custom-builds your website from scratch. You'll see a preview before it goes live and have rounds of feedback to make sure everything looks, feels, and works exactly right."
    - num: "04"
      title: You Launch
      dur: Launch day
      text: "Your website goes live. We show you how to update it yourself, and we're here if you ever need help. It's your site — fully in your hands."
  ctas:
