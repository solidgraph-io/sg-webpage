# SolidGraph Solutions LLC — DroneCI Pipeline (web-only)
# SPEC-INFRA-001/RF-8
#
# Gates (in dependency order):
#   install    → all branches, all events
#   validate   → all branches (lint + type-check + prettier)
#   test       → all branches (vitest + trace check)
#   build      → develop + main, push only
#   build-push-web → main, push only (docker → registry)
#   trigger-dokploy → main, push only
#
# Secrets required in Drone (Settings → Secrets):
#   TURBO_TOKEN          Turborepo Remote Cache API token
#   TURBO_TEAM           Turborepo team/org slug
#   TURBO_API            Self-hosted cache server URL
#   REGISTRY_USERNAME    Private registry username
#   REGISTRY_PASSWORD    Private registry password
#   DOKPLOY_WEBHOOK_WEB  Dokploy deploy webhook URL for web service

kind: pipeline
type: docker
name: solidgraph-webpage

steps:
  # ── 1. install ──────────────────────────────────────────────────────────────
  - name: install
    image: node:22-alpine
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile

  # ── 2. validate ─────────────────────────────────────────────────────────────
  - name: validate
    image: node:22-alpine
    depends_on: [install]
    environment:
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm lint
      - pnpm type-check
      - npx prettier --check .

  # ── 3. test + trace ─────────────────────────────────────────────────────────
  - name: test
    image: node:22-alpine
    depends_on: [validate]
    environment:
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm test
      - pnpm trace -- --check

  # ── 4. visual-test (design fidelity gate) ───────────────────────────────────
  # SPEC-QA-001/RF-5 — bloqueante; corre contra el build de producción (CI=true)
  - name: visual-test
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    depends_on: [test]
    environment:
      CI: "true"
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile
      - pnpm --filter @solidgraph/web build
      - pnpm --filter @solidgraph/web test:e2e

  # ── 4b. a11y gate (axe WCAG AA — SPEC-A11Y-001/RF-7, INV-1) ────────────────
  # Runs after visual-test (build already done); reuses the same server.
  - name: a11y-test
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    depends_on: [visual-test]
    environment:
      CI: "true"
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile
      - pnpm --filter @solidgraph/web build
      - pnpm --filter @solidgraph/web exec playwright test tests/a11y/

  # ── 5. build ─────────────────────────────────────────────────────────────────
  - name: build
    image: node:22-alpine
    depends_on: [visual-test, a11y-test]
    when:
      branch:
        - develop
        - main
      event:
        - push
    environment:
      TURBO_TOKEN:
        from_secret: TURBO_TOKEN
      TURBO_TEAM:
        from_secret: TURBO_TEAM
      TURBO_API:
        from_secret: TURBO_API
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm build

  # ── 4c. perf-test (Lighthouse CI — SPEC-PERF-001/RF-1, INV-1) ───────────────
  # Runs after build (dist/ ready); lhci starts its own preview server.
  - name: perf-test
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    depends_on: [build]
    when:
      branch:
        - develop
        - main
      event:
        - push
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile
      - npx @lhci/cli@latest autorun --config=.lighthouserc.js

  # ── 5. build-push-web ────────────────────────────────────────────────────────
  - name: build-push-web
    image: plugins/docker
    depends_on: [build, perf-test]
    when:
      branch:
        - main
      event:
        - push
    settings:
      registry: registry.solidgraph.dev
      repo: registry.solidgraph.dev/solidgraph-web
      dockerfile: apps/web/Dockerfile
      context: .
      mtu: 1450
      tags:
        - ${DRONE_COMMIT_SHA}
        - latest
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD

  # ── 6. trigger-dokploy ───────────────────────────────────────────────────────
  - name: trigger-dokploy
    image: curlimages/curl
    depends_on: [build-push-web]
    when:
      branch:
        - main
      event:
        - push
    environment:
      DOKPLOY_WEBHOOK_WEB:
        from_secret: DOKPLOY_WEBHOOK_WEB
    commands:
      - curl -sf -X POST $${DOKPLOY_WEBHOOK_WEB}

trigger:
  event:
    - push
    - pull_request
