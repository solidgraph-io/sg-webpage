<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolidGraph · Section · CTA Strip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/base.css" />
    <link rel="stylesheet" href="../design-system/animations.css" />
    <link rel="stylesheet" href="../components/aurora.css" />
    <link rel="stylesheet" href="../components/button.css" />
    <link rel="stylesheet" href="../components/cta-strip.css" />
  </head>
  <body style="padding: 60px 0">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 12h14M13 5l7 7-7 7"
          />
        </symbol>
      </defs>
    </svg>

    <!-- ===================== CTA STRIP ===================== -->
    <div class="cta-wrap" data-section="cta" data-screen-label="CTA">
      <div class="cta-strip has-spot" data-reveal="scale">
        <div class="spotlight"></div>
        <div class="aurora"><b class="a1"></b><b class="a2"></b></div>
        <div class="cta-strip-content">
          <h3>Ready to Get Started?</h3>
          <p>Tell us about your business. The first conversation is always free.</p>
        </div>
        <a href="#contact" class="btn btn-white magnetic"
          ><span>Get a Free Quote</span> <svg width="16" height="16"><use href="#i-arrow" /></svg
        ></a>
      </div>
    </div>

    <script src="../scripts/interactions.js"></script>
  </body>
</html>
