<style>
  /* Section-layout CSS lives in each sections/*.html file. index.html mirrors
     it here so the composed page matches the standalone sections exactly. */

  /* nav */
  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; transition: transform .4s var(--ease), background .4s ease, box-shadow .4s ease, padding .4s ease; }
  .nav-inner { max-width: var(--max); margin: 14px auto 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; height: 66px; padding-left: 22px; padding-right: 14px; border-radius: 999px; background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(45,61,138,.08); box-shadow: 0 8px 30px -16px rgba(31,44,102,.22); transition: margin .4s var(--ease), background .4s ease; }
  .nav.scrolled .nav-inner { margin-top: 8px; background: rgba(255,255,255,.88); }
  .nav.hide { transform: translateY(-130%); }
  .nav-links { display: flex; gap: 6px; }
  .nav-links a { font-size: 13.5px; font-weight: 500; color: var(--ink); padding: 9px 15px; border-radius: 999px; transition: background .2s ease, color .2s ease; }
  .nav-links a:hover { background: var(--lilac); color: var(--indigo); }
  .nav-cta { padding: 11px 22px; font-size: 13px; }
  @media (max-width: 900px) { .nav-links { display: none; } }

  /* hero */
  .hero { position: relative; overflow: hidden; background: var(--night); color: #fff; padding: 168px 0 120px; isolation: isolate; }
  .hero-grid-mesh { position: absolute; inset: 0; z-index: 0; opacity: .5; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 75%); }
  .hero-inner { position: relative; z-index: 2; }
  .hero-top { display: flex; justify-content: center; margin-bottom: 30px; }
  .hero .pill { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(6px); }
  .hero h1 { color: #fff; text-align: center; max-width: 16ch; margin: 0 auto; }
  .hero-sub { text-align: center; max-width: 600px; margin: 30px auto 0; color: var(--muted-d); font-size: 18px; line-height: 1.7; }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .hero-snippet { margin-top: 30px; text-align: center; color: var(--peri-bright); font-size: 13.5px; font-weight: 500; letter-spacing: .04em; }
  .hero-stage { position: relative; margin: 72px auto 0; max-width: 980px; perspective: 1600px; }
  .hero-screen { position: relative; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.12); transform: rotateX(14deg) scale(.98); transform-origin: 50% 100%; background: #fff; }
  .hs-bar { background: #f3f5fc; padding: 12px 18px; display: flex; align-items: center; gap: 8px; }
  .hs-bar i { width: 11px; height: 11px; border-radius: 50%; background: #d8defa; }
  .hs-bar i:nth-child(1){ background:#ff6b6b; } .hs-bar i:nth-child(2){ background:#ffd166; } .hs-bar i:nth-child(3){ background:#34d39a; }
  .hs-bar .url { margin-left: 12px; flex: 1; background: #fff; border-radius: 999px; height: 22px; max-width: 280px; display: flex; align-items: center; padding: 0 12px; font-size: 10px; color: var(--muted); }
  .hs-body { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; min-height: 320px; }
  .hs-left { padding: 40px 38px; }
  .hs-left .tag { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--periwinkle); font-weight: 700; }
  .hs-left h4 { font-size: 30px; font-weight: 800; color: var(--ink); margin: 14px 0 12px; letter-spacing: -.02em; line-height: 1.05; }
  .hs-left h4 b { color: var(--indigo); }
  .hs-left p { font-size: 12px; color: var(--muted); margin-bottom: 18px; max-width: 30ch; }
  .hs-left .b { display: inline-flex; background: var(--indigo); color: #fff; font-size: 11px; font-weight: 600; padding: 9px 18px; border-radius: 999px; }
  .hs-left .chips { margin-top: 22px; }
  .hs-right { background: linear-gradient(150deg, var(--indigo), var(--night)); position: relative; overflow: hidden; display: grid; place-items: center; }
  .hs-right .ring { position: absolute; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; }
  .hs-right .ring.r1 { inset: 18%; } .hs-right .ring.r2 { inset: 30%; } .hs-right .ring.r3 { inset: 42%; }
  .hs-right .core { width: 92px; height: 92px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; box-shadow: 0 20px 50px -10px rgba(0,0,0,.4); }
  .hs-right .core img { width: 58px; }
  .hero-float.f1 { top: 18%; left: -36px; animation: bob 5s ease-in-out infinite; }
  .hero-float.f2 { bottom: 16%; right: -30px; animation: bob 6s ease-in-out infinite .8s; }
  @media (max-width: 760px) { .hero-float { display: none; } .hs-body { grid-template-columns: 1fr; } .hs-right { min-height: 160px; } }

  /* pain points */
  .pain { padding: 120px 0 110px; background: var(--lilac-2); position: relative; }
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 18px; max-width: 1060px; margin: 0 auto; }
  @media (max-width: 880px) { .bento { grid-template-columns: 1fr 1fr; } .bento-wide, .bento-feature { grid-column: span 2; } }
  @media (max-width: 540px) { .bento { grid-template-columns: 1fr; } .bento-wide, .bento-feature { grid-column: span 1; } }

  /* value */
  .value { padding: 130px 0 110px; position: relative; overflow: hidden; }
  .value-head { display: grid; grid-template-columns: 1.05fr .95fr; gap: 70px; align-items: end; margin-bottom: 70px; }
  .value-head h2 { margin-top: 20px; }
  .value-head .lead { color: var(--muted); font-size: 16px; line-height: 1.8; }
  .value-head .lead .strong { color: var(--ink); font-weight: 600; display: block; margin-bottom: 14px; font-size: 18px; }
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 980px) { .value-head { grid-template-columns: 1fr; gap: 26px; } .pillars { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 540px) { .pillars { grid-template-columns: 1fr; } }

  /* how it works */
  .how { background: var(--night); color: #fff; padding: 130px 0; position: relative; overflow: hidden; }
  .how .aurora b { opacity: .35; }
  .how-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 70px; align-items: start; position: relative; z-index: 2; }
  .how-sticky { position: sticky; top: 120px; }
  .how-sticky .eyebrow { color: var(--peri-bright); }
  .how-sticky .eyebrow::before { background: var(--peri-bright); }
  .how h2 { color: #fff; margin: 20px 0 16px; }
  .how-sticky > p { color: var(--muted-d); font-size: 16px; line-height: 1.7; max-width: 38ch; }
  .how-progress { margin-top: 36px; display: flex; gap: 8px; }
  .how-progress i { height: 4px; flex: 1; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
  .how-progress i.on { background: var(--peri-bright); }
  .how-ctas { margin-top: 38px; display: flex; gap: 14px; }
  .steps { display: flex; flex-direction: column; gap: 22px; }
  @media (max-width: 980px) { .how-grid { grid-template-columns: 1fr; gap: 44px; } .how-sticky { position: static; } }

  /* plans */
  .plans { padding: 130px 0 110px; background: #fff; position: relative; }
  .plan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: stretch; }
  @media (max-width: 1100px) { .plan-grid { grid-template-columns: 1fr 1fr; } .plan.popular { transform: none; } .plan.popular:hover { transform: translateY(-8px); } }
  @media (max-width: 600px) { .plan-grid { grid-template-columns: 1fr; } }
  .hosting { margin-top: 84px; }
  .hosting-head { text-align: center; max-width: 640px; margin: 0 auto 40px; }
  .hosting-head h3 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 10px; }
  .hosting-head p { color: var(--muted); font-size: 15px; }
  .hosting-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 980px) { .hosting-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 540px) { .hosting-grid { grid-template-columns: 1fr; } }

  /* testimonials */
  .testimonials { padding: 120px 0; background: var(--lilac-2); position: relative; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; max-width: 880px; margin: 0 auto 64px; }
  .t-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  @media (max-width: 880px) { .stats { grid-template-columns: 1fr; } .t-grid { grid-template-columns: 1fr; } }

  /* portfolio */
  .portfolio { padding: 130px 0 120px; background: #fff; position: relative; overflow: hidden; }
  .p-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .portfolio .center-cta { margin-top: 56px; text-align: center; }
  @media (max-width: 880px) { .p-grid { grid-template-columns: 1fr; } }

  /* about */
  .about { padding: 130px 0; background: var(--lilac-2); position: relative; overflow: hidden; }
  .about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 80px; align-items: center; }
  .about-visual { position: relative; aspect-ratio: 1/1; max-width: 460px; }
  .about-visual .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(45,61,138,.2); animation: spin 40s linear infinite; }
  .about-visual .orbit.o2 { inset: 14%; border-color: rgba(92,112,214,.25); animation-duration: 28s; animation-direction: reverse; }
  .about-visual .center-logo { position: absolute; inset: 27%; border-radius: 50%; background: #fff; box-shadow: var(--shadow-lg); display: grid; place-items: center; padding: 7%; }
  .about-visual .center-logo img { width: 100%; height: auto; }
  .about-visual .b1 { top: 2%; left: -6%; animation: bob 5s ease-in-out infinite; }
  .about-visual .b2 { bottom: 22%; right: -10%; animation: bob 6s ease-in-out infinite .6s; }
  .about-visual .b3 { bottom: 0%; left: 10%; animation: bob 5.4s ease-in-out infinite 1.1s; }
  .about h2 { margin-bottom: 20px; }
  .about-sub { color: var(--periwinkle); font-weight: 600; font-size: 14px; margin-bottom: 24px; }
  .about-body p { color: var(--muted); font-size: 14.5px; line-height: 1.8; margin-bottom: 16px; }
  .diff-list { margin-top: 34px; display: flex; flex-direction: column; gap: 18px; }
  .diff { display: grid; grid-template-columns: 48px 1fr; gap: 18px; align-items: flex-start; }
  .diff .ic { width: 48px; height: 48px; border-radius: 13px; background: #fff; color: var(--indigo); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
  .diff h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .diff p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .about-cities { margin-top: 42px; background: #fff; border-radius: var(--radius); padding: 26px 28px; box-shadow: var(--shadow-sm); }
  .about-cities .h { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--periwinkle); font-weight: 700; margin-bottom: 16px; }
  .about-cities .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .about-cities .city b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .about-cities .city span { font-size: 12px; color: var(--muted); line-height: 1.6; }
  @media (max-width: 980px) { .about-grid { grid-template-columns: 1fr; gap: 64px; } .about-visual { margin: 0 auto; } .about-cities .cities { grid-template-columns: 1fr; } }

  /* faq */
  .faq { padding: 130px 0; background: #fff; }
  .faq-list { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  /* contact */
  .contact { padding: 130px 0 100px; background: #fff; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 64px; align-items: start; }
  .contact h2 { margin: 18px 0 0; }
  .contact .lead { color: var(--muted); font-size: 15px; line-height: 1.75; margin-top: 18px; }
  .contact-alt { margin-top: 38px; background: var(--lilac-2); border-radius: var(--radius); padding: 26px 28px; }
  .contact-alt h4 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .contact-alt .row { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
  .contact-alt .row .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--indigo); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .contact-alt .row b { color: var(--ink); font-size: 13.5px; font-weight: 600; display: block; }
  .contact-alt .row span { color: var(--muted); font-size: 12px; }
  @media (max-width: 880px) { .contact-grid { grid-template-columns: 1fr; } .field-grid { grid-template-columns: 1fr; } }

  /* footer */
  footer { background: var(--night-2); color: #fff; padding: 80px 0 32px; position: relative; overflow: hidden; }
  .foot-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 44px; padding-bottom: 54px; border-bottom: 1px solid rgba(255,255,255,.1); position: relative; z-index: 2; }
  .foot-brand { display: flex; flex-direction: column; gap: 20px; max-width: 290px; }
  .foot-brand .logo-text b { color: #fff; } .foot-brand .logo-text small { color: rgba(255,255,255,.6); }
  .foot-brand p { font-size: 13px; color: rgba(255,255,255,.62); line-height: 1.6; }
  .foot-brand .locs { display: flex; flex-wrap: wrap; gap: 8px; }
  .foot-brand .locs span { font-size: 11px; color: #fff; background: rgba(255,255,255,.08); padding: 6px 13px; border-radius: 999px; }
  .foot-col h5 { color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 20px; }
  .foot-col ul { display: flex; flex-direction: column; gap: 11px; }
  .foot-col ul li a { font-size: 13.5px; color: rgba(255,255,255,.7); transition: color .2s ease, padding-left .2s ease; }
  .foot-col ul li a:hover { color: #fff; padding-left: 4px; }
  .foot-bottom { padding-top: 30px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; font-size: 12px; color: rgba(255,255,255,.5); position: relative; z-index: 2; }
  .foot-bottom .legal { display: flex; gap: 18px; }
  .foot-bottom .legal a { color: rgba(255,255,255,.5); }
  .foot-bottom .legal a:hover { color: #fff; }
  footer .foot-big { position: absolute; bottom: -3%; left: 0; right: 0; text-align: center; font-size: 20vw; font-weight: 800; color: rgba(255,255,255,.025); letter-spacing: -.04em; pointer-events: none; line-height: 1; z-index: 1; white-space: nowrap; }
  @media (max-width: 880px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 32px; } .foot-brand { grid-column: 1 / -1; } }

  /* loader fallback */
  #app:empty::before { content: "Loading SolidGraph…"; display: block; padding: 40vh 0; text-align: center; color: var(--muted); font-size: 14px; }
</style>

<script>
/* Compose the page from the independent section documents. Each section file
   is a full, standalone HTML document; we fetch it, fix its relative asset
   paths, lift out its [data-section] root, and append it in order. */
(function () {
  var SECTIONS = [
    '01-nav', '02-hero', '03-marquee', '04-pain-points', '05-value',
    '06-how-it-works', '07-plans', '08-testimonials', '09-portfolio',
    '10-about', '11-faq', '12-cta', '13-contact', '14-footer'
  ];
  var app = document.getElementById('app');
  var parser = new DOMParser();

  Promise.all(SECTIONS.map(function (name) {
    return fetch('sections/' + name + '.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        // sections live in /sections, so their assets use ../assets — rebase to root
        html = html.split('../assets/').join('assets/');
        var doc = parser.parseFromString(html, 'text/html');
        return doc.querySelector('[data-section]');
      })
      .catch(function () { return null; });
  })).then(function (nodes) {
    nodes.forEach(function (node) {
      if (node) app.appendChild(document.importNode(node, true));
    });
    if (window.SolidGraph) window.SolidGraph.init(document);
  });
})();
</script>

</body>
